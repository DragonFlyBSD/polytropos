[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dports-dev-env"
version = "0.1.0"
description = "DragonFly DeltaPorts development environment manager"
requires-python = ">=3.11"
license = "BSD-2-Clause"
# Deliberately stdlib-only. This package is installed into its own venv and
# run as root to manage chroots, so every dependency here is a dependency of
# root. It must NOT depend on the generator: the generator depends on this,
# and that edge points one way.
dependencies = []

[project.scripts]
dports-dev-env = "dports_dev_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dports_dev_env"]
artifacts = ["dports_dev_env/runtime-profiles.toml"]
