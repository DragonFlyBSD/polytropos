[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dports-dragonfly"
version = "0.0.1-alpha"
description = "DragonFly BSD Ports overlay management tool"
readme = {text = "", content-type = "text/plain"}
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [
    { name = "DragonFly BSD Project" }
]
keywords = ["dragonfly", "bsd", "ports", "freebsd", "dports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: BSD",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "tomli >= 2.0; python_version < '3.11'",
    "tomli_w >= 1.0",
    # The dev-env manager. This is the ONE declared edge between the two
    # distributions, and it points this way only: the agent resolves and
    # probes envs through `dports_dev_env`, and nothing in `dports_dev_env`
    # imports back. Keep it acyclic — the dev-env venv is deliberately
    # light because it runs as root to manage chroots.
    "dports-dev-env",
]

[tool.uv.sources]
dports-dev-env = { path = "dev-env", editable = true }

[project.optional-dependencies]
tracker = ["fastapi", "uvicorn[standard]", "jinja2"]
agent = ["litellm"]
dev = ["pytest", "mypy", "httpx"]

[project.scripts]
dportsv3 = "dportsv3.cli:main"
artifact-store-client = "dportsv3.artifact_store_client:main"

[project.urls]
Homepage = "https://github.com/DragonFlyBSD/DeltaPorts"
Repository = "https://github.com/DragonFlyBSD/DeltaPorts"

[tool.hatch.build.targets.wheel]
packages = ["dportsv3"]
# Non-.py files the tool reads at runtime. Without these the package installs
# and imports fine but the agent comes up with no playbooks and no policy —
# the exact silent degradation `dportsv3/paths.py` exists to prevent, so it
# raises rather than shrugs if any of it is missing.
artifacts = [
    "dportsv3/agent/playbooks/*.md",
    "dportsv3/agent/dops_quickref.md",
    "dportsv3/data/config/*.sample",
]

# The rc.d scripts and their config samples live at the repo root, where an
# operator browsing the checkout will find them, but they have to survive
# packaging too — `dportsv3 deploy install` is how a host without a checkout
# gets them. force-include keeps one source of truth and lands a copy inside
# the package, which paths.deploy_dir() then resolves downward like every
# other bundled input.
[tool.hatch.build.targets.wheel.force-include]
"deploy" = "dportsv3/data/deploy"
